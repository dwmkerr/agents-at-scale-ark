name: Fork — Build & Push ark-api to GHCR

# Fork-only image publish for branch testing against external clusters.
# Pushes ghcr.io/<owner>/ark-api:<branch-slug>-<sha> on push to fix/* or
# fork-build/* branches and on manual dispatch. Skipped on upstream via
# the `if:` gate so it can never collide with the official
# ghcr.io/mckinsey/agents-at-scale-ark images.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (default = branch slug + short sha)'
        required: false
        type: string
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'fork-build/**'
    paths:
      - 'services/ark-api/**'
      - 'lib/ark-sdk/**'
      - 'ark/config/crd/bases/**'
      - '.github/workflows/fork-build-ark-api.yaml'

jobs:
  build-and-push:
    if: github.repository != 'mckinsey/agents-at-scale-ark'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # ark-sdk build needs uv (Python), Node (openapi-generator-cli),
       # Python interpreter. Match versions to upstream CI/CD where possible.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v3

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            SHA="${GITHUB_SHA::7}"
            echo "value=${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ark-sdk wheel + stage into ark-api context
        # Same prebuild the upstream CI/CD matrix runs for ark-api. Cascades:
        # CRDs → OpenAPI → generated Python SDK → overlay applied → wheel,
        # then copied into services/ark-api/ark-api/out/ for the Dockerfile.
        run: |
          make ark-api-deps
          mkdir -p services/ark-api/ark-api/out
          cp out/ark-sdk/py-sdk/dist/ark_sdk-*.whl services/ark-api/ark-api/out/

      - uses: docker/build-push-action@v6
        with:
          context: services/ark-api
          file: services/ark-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ark-api:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/ark-api:latest-fork

      - name: Summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/ark-api:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
